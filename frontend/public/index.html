<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Escritório NVS Tech</title>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<style>
:root{--bg:#f4f3ef;--panel:#ffffff;--ink:#22252a;--soft:#666b73;--line:#e2e0da;--yellow:#f5c518;--blue:#1c5fb8;--ok:#2e8f63;--danger:#d6432d}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,"Segoe UI",sans-serif;overflow:hidden}
button{font:inherit}
#principal{flex:1;min-width:0;display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
#stage canvas{display:block;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tagwrap{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:4px;width:0;will-change:transform}
.tagwrap:has(.bubble:not([hidden])){z-index:5}
.tag{pointer-events:auto;border:0;border-radius:99px;padding:1px 7px;background:rgba(255,255,255,.94);box-shadow:0 1px 3px rgba(0,0,0,.25);color:var(--ink);font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap}
.tag.sel{background:var(--yellow);color:#15171a}
.bubble{width:max-content;max-width:210px;padding:7px 10px;border-radius:10px;background:#fff;color:#15171a;box-shadow:0 2px 8px rgba(0,0,0,.4);font-size:12.5px;line-height:1.3;text-align:center}
.bubble[hidden]{display:none}
#top{position:absolute;left:14px;top:12px;pointer-events:none;background:rgba(255,255,255,.88);border-radius:10px;padding:6px 10px}
#top h1{margin:0;font-size:19px;letter-spacing:-.01em}
#top h1 span{color:var(--blue)}
#views{position:absolute;right:14px;top:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 150px)}
#views button{border:1px solid var(--line);border-radius:8px;padding:5px 10px;background:#fff;color:var(--ink);font-size:12.5px;cursor:pointer}
#views button:hover{border-color:var(--yellow)}
aside{flex:none;width:280px;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto}
h2{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--soft)}
aside h2{padding:14px 16px 8px}
#team{padding:0 8px 12px;display:grid;gap:4px}
.card{width:100%;display:block;text-align:left;border:1px solid transparent;background:none;color:inherit;padding:9px 8px;border-radius:9px;cursor:pointer}
.card:hover{background:#f4f3ef}
.card.sel{background:#f4f3ef;border-color:var(--line)}
.card .row{display:flex;align-items:baseline;gap:7px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;align-self:center}
.card b{font-size:14px}
.card .role{color:var(--soft);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .st{display:block;font-size:12.5px;margin-top:3px;min-height:18px}
.bar{display:block;height:6px;margin-top:6px;border-radius:9px;background:#e9e7e1;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--yellow);transition:width .4s}
.card .info{display:block;font-size:11.5px;color:var(--soft);margin-top:5px;min-height:16px}
#entregas{flex:0 0 clamp(220px,36vh,340px);display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line);min-height:0}
#e-topo{display:flex;align-items:center;gap:12px;padding:10px 16px 8px;border-bottom:1px solid #eeece6}
#e-topo p{margin:0;font-size:12.5px;color:var(--soft);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gerar{flex:none;border:0;border-radius:8px;background:var(--yellow);color:#15171a;font-weight:600;padding:5px 12px;font-size:12.5px;cursor:pointer}
#gerar[hidden]{display:none}
#e-corpo{flex:1;min-height:0;display:grid;grid-template-columns:minmax(230px,300px) 1fr;overflow:hidden}
#e-corpo[hidden]{display:none}
#e-painel{padding:10px 16px;border-right:1px solid #eeece6;overflow:auto}
#e-painel p{margin:6px 0 0;font-size:12px;color:var(--soft)}
#e-erro{color:var(--danger)!important}
#e-painel table{width:100%;border-collapse:collapse;font-size:13px}
#e-painel th,#e-painel td{padding:3px 4px;text-align:right;font-weight:500}
#e-painel thead th{color:var(--soft);font-size:11.5px}
#e-painel tbody th{text-align:left}
#e-painel td:nth-child(2){color:var(--danger);font-weight:700}
#e-painel #ra-ativos{color:inherit;font-weight:500}
#e-lista{padding:6px 16px 10px;overflow:auto}
#e-lista details{border-bottom:1px solid #eeece6;padding:6px 0}
#e-lista summary{cursor:pointer;font-size:13px;font-weight:600}
#e-lista summary span{font-weight:400;color:var(--soft);margin-left:6px;font-size:12px}
#e-lista p{margin:5px 0 0;font-size:13px}
#e-lista pre{margin:4px 0 0;font:12.5px/1.45 system-ui,"Segoe UI",sans-serif;white-space:pre-wrap;tab-size:20;color:var(--soft)}
#e-vazio{padding:16px;color:var(--soft);font-size:13px;margin:0}
#fail{position:absolute;inset:0;display:none;place-items:center;padding:20px;text-align:center}
@media(max-width:820px){
 body{flex-direction:column;overflow:auto}
 html,body{height:auto}
 #principal{flex:none}
 #stage{flex:none;height:56vh}
 #entregas{flex:none;height:auto;max-height:70vh}
 #e-corpo{grid-template-columns:1fr;overflow:auto}
 #e-painel{border-right:0;border-bottom:1px solid #eeece6}
 aside{width:100%;border-left:0;border-top:1px solid var(--line)}
 #views{top:58px;right:auto;left:14px;justify-content:flex-start;max-width:calc(100% - 28px)}
}
</style>
</head>
<body>
<div id="principal">
  <main id="stage">
    <div id="labels"></div>
    <div id="top"><h1><span>NVS</span> Tech</h1></div>
    <div id="views" role="group" aria-label="Escolher visão">
      <button type="button" data-view="geral">Visão geral</button>
      <button type="button" data-view="nvs">Mural NVS</button>
      <button type="button" data-view="novaes">Sala Novaes</button>
      <button type="button" data-view="cabine">Cabine</button>
      <button type="button" data-view="escada">Escada</button>
      <button type="button" data-view="estoque">Estoque</button>
      <button type="button" data-view="expedicao">Expedição</button>
      <button type="button" data-view="frente">Entrada</button>
    </div>
    <div id="fail">Não consegui carregar o 3D. Confira a internet e se o navegador tem WebGL ligado.</div>
  </main>
  <section id="entregas" aria-labelledby="e-titulo">
    <div id="e-topo">
      <h2 id="e-titulo"></h2>
      <p id="e-objetivo"></p>
      <button id="gerar" type="button">Gerar relatório agora</button>
    </div>
    <p id="e-vazio"></p>
    <div id="e-corpo" hidden>
      <div id="e-painel">
        <table id="p-luisa">
          <thead><tr><th></th><th>Atrasados</th><th>Hoje</th><th>Depois</th></tr></thead>
          <tbody>
            <tr><th>Mercado Livre</th><td id="ml-a">-</td><td id="ml-h">-</td><td id="ml-p">-</td></tr>
            <tr><th>Shopee</th><td id="sh-a">-</td><td id="sh-h">-</td><td id="sh-p">-</td></tr>
          </tbody>
        </table>
        <table id="p-rafael" hidden>
          <tbody>
            <tr><th>Sem promoção</th><td id="ra-sem">-</td></tr>
            <tr><th>Anúncios ativos</th><td id="ra-ativos">-</td></tr>
          </tbody>
        </table>
        <p id="e-atualizado"></p>
        <p id="e-tokens"></p>
        <p id="e-erro" role="alert" hidden></p>
      </div>
      <div id="e-lista"></div>
    </div>
  </section>
</div>
<aside aria-labelledby="progresso-titulo">
  <h2 id="progresso-titulo">Progresso</h2>
  <div id="team"></div>
</aside>
<script>setTimeout(()=>{if(!window.__ok)document.getElementById('fail').style.display='grid'},8000)</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';

const $=s=>document.querySelector(s);
const stage=$('#stage'),labels=$('#labels');
const scene=new THREE.Scene();scene.background=new THREE.Color(0xf4f3ef);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);
window.__ok=true;

const cam=new THREE.OrthographicCamera(-1,1,1,-1,.1,300);
const controls=new OrbitControls(cam,renderer.domElement);
Object.assign(controls,{enablePan:false,enableDamping:true,minZoom:.55,maxZoom:3.2,minPolarAngle:.35,maxPolarAngle:1.3});
function resize(){
  const w=stage.clientWidth,h=stage.clientHeight,asp=w/h,d=Math.max(7.8,10.5/asp);
  renderer.setSize(w,h);
  Object.assign(cam,{left:-d*asp,right:d*asp,top:d,bottom:-d});cam.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);resize();

/* ---------- Visões da câmera ---------- */
const VIEWS={
  geral:{t:[-3.5,-.6,8.6],az:1.2,el:.66,zoom:.72},
  nvs:{t:[-8,1.6,-1.2],az:1.4,el:.3,zoom:1.5},
  novaes:{t:[1.2,1,-1.6],az:-1.05,el:.48,zoom:1.75},
  cabine:{t:[-8.4,.9,5.6],az:2.2,el:.85,zoom:2.4},
  escada:{t:[.4,-.6,6.2],az:.85,el:.32,zoom:1.6},
  estoque:{t:[-2.6,-1.1,8.6],az:.62,el:.55,zoom:1.45},
  expedicao:{t:[-1.4,-2,15.6],az:.82,el:.6,zoom:1.75},
  frente:{t:[-1.4,-2,20],az:.62,el:.6,zoom:1.5},
};
const startView=VIEWS[location.hash.slice(1)]||VIEWS.geral;
let tween=null;
const viewPos=v=>{const R=70,[x,y,z]=v.t;return new THREE.Vector3(x+R*Math.sin(v.az)*Math.cos(v.el),y+R*Math.sin(v.el),z+R*Math.cos(v.az)*Math.cos(v.el))};
controls.target.set(...startView.t);cam.position.copy(viewPos(startView));cam.zoom=startView.zoom;cam.updateProjectionMatrix();
document.querySelectorAll('#views button').forEach(b=>b.onclick=()=>{tween=VIEWS[b.dataset.view]});
controls.addEventListener('start',()=>{tween=null});

scene.add(new THREE.HemisphereLight(0xffffff,0xa9a59c,1.7));
const sun=new THREE.DirectionalLight(0xffffff,1.7);sun.position.set(11,30,20);sun.castShadow=true;
sun.shadow.mapSize.set(3072,3072);sun.target.position.set(-3,0,8);scene.add(sun.target);
Object.assign(sun.shadow.camera,{left:-30,right:30,top:30,bottom:-30,far:110});sun.shadow.bias=-.0006;
scene.add(sun);
const chao=new THREE.Mesh(new THREE.PlaneGeometry(160,160),new THREE.ShadowMaterial({opacity:.13}));chao.rotation.x=-Math.PI/2;chao.position.y=-3.21;chao.receiveShadow=true;scene.add(chao);

const mats={};
const M=c=>mats[c]||(mats[c]=new THREE.MeshStandardMaterial({color:c,roughness:.82}));
function box(w,h,d,c,x,y,z,p=scene,cast=true){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),typeof c==='number'?M(c):c);
  m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=true;p.add(m);return m;
}
function textPlane(w,h,cw,ch,draw){
  const cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
  const ctx=cv.getContext('2d'),tex=new THREE.CanvasTexture(cv);tex.colorSpace=THREE.SRGBColorSpace;
  const mesh=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex}));
  return {mesh,paint:(...a)=>{draw(ctx,cw,ch,...a);tex.needsUpdate=true}};
}
const loader=new THREE.TextureLoader();
function photoPlane(url,w,h,transparent){
  const t=loader.load(url);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;
  return new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:t,transparent,depthWrite:!transparent}));
}

/* ---------- Planta (medidas aproximadas, tiradas das fotos) ---------- */
const X0=-10,X1=3,Z0=-6.4,Z1=12.4,WX=-6.9,H=3.4,T=.2,BASE=3,TERREO=-3,EX0=-6,EZ1=18.6,CZ1=23.8,TETO=1.2; /* WX: lateral de vidro da cabine; BASE: altura do estoque, um andar abaixo */
const tile=(()=>{const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  g.fillStyle='#efede8';g.fillRect(0,0,256,256);g.strokeStyle='#c9c6be';g.lineWidth=3;g.strokeRect(0,0,256,256);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set((X1-X0)/1.4,(4-Z0)/1.4);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t})();
box(X1-X0,.2,4-Z0,new THREE.MeshStandardMaterial({map:tile,roughness:.28}),(X0+X1)/2,-.1,(Z0+4)/2,scene,false);
box(X1-X0,BASE-.2,4-Z0,0xdedbd4,(X0+X1)/2,-.2-(BASE-.2)/2,(Z0+4)/2,scene,false);
const slab=(x0,x1,z0,z1,c=0xdedbd4)=>box(x1-x0,BASE,z1-z0,c,(x0+x1)/2,-BASE/2,(z0+z1)/2,scene,false);
slab(X0,WX,4,7,0xefede8); /* bloco sob a cabine */
box(X1-WX,.2,Z1-4,0xe9e7e1,(WX+X1)/2,-BASE-.1,(4+Z1)/2,scene,false);box(WX-X0,.2,Z1-7,0xe9e7e1,(X0+WX)/2,-BASE-.1,(7+Z1)/2,scene,false); /* piso do estoque */

const GLASS=new THREE.MeshStandardMaterial({color:0xb7dbe2,transparent:true,opacity:.22,depthWrite:false,roughness:.1});
const GHOST_FRAME=new THREE.MeshStandardMaterial({color:0xe8e8e8,transparent:true,opacity:.4,depthWrite:false});
const perims=[];
function wall({axis,at,a,b,color,open=[],interior=false,n,base=0,top=H}){
  const g=new THREE.Group();scene.add(g);
  const solid=M(color);
  const ghost=interior?new THREE.MeshStandardMaterial({color,roughness:.9,transparent:true,opacity:.2,depthWrite:false}):solid;
  const piece=(u0,u1,y0,y1,mat,cast=true,th=T)=>{
    if(u1-u0<.01||y1-y0<.01)return;
    const L=u1-u0,c=(u0+u1)/2,y=(y0+y1)/2;
    return axis==='x'?box(L,y1-y0,th,mat,c,y,at,g,cast):box(th,y1-y0,L,mat,at,y,c,g,cast);
  };
  const seg=(u0,u1,y0,y1)=>{
    if(!interior){piece(u0,u1,y0,y1,solid);return}
    piece(u0,u1,y0,Math.min(y1,base+1),solid);piece(u0,u1,Math.max(y0,base+1),y1,ghost,false);
  };
  let c=a;
  for(const o of [...open].sort((p,q)=>p.from-q.from)){
    const bot=o.bottom??base;
    seg(c,o.from,base,top);seg(o.from,o.to,base,bot);seg(o.from,o.to,o.top,top);c=o.to;
    const FR=interior?GHOST_FRAME:M(0xe8e8e8);
    piece(o.from,o.from+.07,bot,o.top,FR,!interior,T+.03);piece(o.to-.07,o.to,bot,o.top,FR,!interior,T+.03);piece(o.from,o.to,o.top-.07,o.top,FR,!interior,T+.03);
    if(bot>base)piece(o.from,o.to,bot,bot+.07,FR,!interior,T+.03);
    if(o.glass)piece(o.from+.07,o.to-.07,bot+.07,o.top-.07,GLASS,false,.04);
  }
  seg(c,b,base,top);
  if(n)perims.push({g,n});
  return g;
}
const LIGHT=0xb6b4af,DARK=0x4b4d51,GRAY=0xcfcfcc;
const wNVS=wall({axis:'z',at:X0-T/2,a:Z0-T,b:Z1+T,color:LIGHT,n:[1,0]});box(T,BASE,Z1-7+T,LIGHT,X0-T/2,-BASE/2,(7+Z1)/2,wNVS,false);
const wFundo=wall({axis:'x',at:Z0-T/2,a:X0,b:X1+T,color:DARK,n:[0,1]});
const wNovaes=wall({axis:'z',at:X1+T/2,a:Z0-T,b:4+T,color:0x828280,n:[-1,0]});
const TEXTURA=0xe4e2dd;
/* parede entre estoque e expedição: a porta CONVERSE e as janelas */
wall({axis:'x',at:Z1+T/2,a:X0-T,b:X1+T,color:0xd9d7d0,interior:true,base:TERREO,top:H,open:[{from:-2.1,to:-.5,top:-.55}]});
const wEscada=wall({axis:'z',at:X1+T/2,a:4,b:Z1,color:TEXTURA,n:[-1,0]});box(T,BASE,Z1-4,TEXTURA,X1+T/2,-BASE/2,(4+Z1)/2,wEscada,false);
wall({axis:'z',at:-3,a:Z0,b:4,color:GRAY,interior:true,open:[{from:-1.6,to:2.6,bottom:1.1,top:2.5,glass:true},{from:3,to:3.9,top:2.5}]});
wall({axis:'x',at:4,a:X0,b:X1,color:DARK,interior:true,open:[{from:-9.9,to:-8.9,top:2.5,glass:true},{from:-8.5,to:-7.4,bottom:1.1,top:2.4,glass:true},{from:-6.9,to:-4,bottom:1.1,top:2.4,glass:true},{from:-2.3,to:1.1,bottom:1.1,top:2.5},{from:1.55,to:2.85,top:2.6}]});
box(3.5,.07,.36,0x0e0f11,-.6,1.12,4); /* peitoril de granito do corredor */
wall({axis:'x',at:2.2,a:-3,b:X1,color:GRAY,interior:true,open:[{from:1.4,to:2.4,top:2.5}]});
wall({axis:'z',at:-6.9,a:4,b:7,color:GRAY,interior:true,open:[{from:4.2,to:6.8,bottom:.95,top:2.8,glass:true}]});
wall({axis:'x',at:7,a:X0,b:WX,color:GRAY,interior:true,open:[{from:-9.8,to:-7.1,bottom:.95,top:2.8,glass:true}]});
box(2.8,.07,.3,0x0e0f11,-8.45,.97,7); /* peitoril de granito da frente da cabine */
box(.3,.07,2.8,0x0e0f11,-6.9,.97,5.5); /* peitoril de granito da cabine */
/* rodapé: continua visível quando a parede da frente some */
const CURB=0xc9c6bf;
box(T,.25,4-Z0+.2,CURB,X1+T/2,.125,(Z0+4)/2,scene,false);box(T,.25,7-Z0+.2,CURB,X0-T/2,.125,(Z0+7)/2,scene,false);box(X1-X0+.2,.25,T,CURB,(X0+X1)/2,.125,Z0-T/2,scene,false);
box(T,.25,CZ1-4,CURB,X1+T/2,TERREO+.125,(4+CZ1)/2,scene,false);box(T,.25,Z1-7,CURB,X0-T/2,TERREO+.125,(7+Z1)/2,scene,false);
box(T,.25,CZ1-Z1,CURB,EX0-T/2,TERREO+.125,(Z1+CZ1)/2,scene,false);box(X1-EX0+T,.25,T,CURB,(EX0+X1)/2,TERREO+.125,CZ1+T/2,scene,false);

/* murais reais */
const mNVS=photoPlane('assets/mural-nvs.jpg',10.4,H,false);mNVS.position.set(X0+.01,H/2,(Z0+4)/2);mNVS.rotation.y=Math.PI/2;wNVS.add(mNVS);
const mNov=photoPlane('assets/mural-novaes.png',5.6,2.08,true);mNov.position.set(X1-.01,1.75,-1.4);mNov.rotation.y=-Math.PI/2;wNovaes.add(mNov);

function fan(parent,x,y,z,ang,r=.38){
  const g=new THREE.Group();g.position.set(x,y,z);g.rotation.y=ang;
  for(const k of[1,.6]){g.add(new THREE.Mesh(new THREE.TorusGeometry(r*k,.014,8,28),M(0x222222)))}
  g.blades=new THREE.Group();g.blades.scale.setScalar(r/.5);g.add(g.blades);
  for(let i=0;i<3;i++){const b=box(.15,.34,.02,0xdddddd,0,.2,0,new THREE.Group(),false);const h=new THREE.Group();h.rotation.z=i*2.09;h.add(b);g.blades.add(h)}
  box(.16,.16,.2,0x1e1e1e,0,0,-.13,g);parent.add(g);fans.push(g);
}
const fans=[];
fan(wNVS,X0+.3,3.03,2.7,Math.PI/2,.5);
for(const z of[-5,-.6,1.6])fan(wNovaes,X1-.3,3,z,-Math.PI/2);

/* cadeiras */
function gaming(x,z,ang,y=0){
  const g=new THREE.Group();g.position.set(x,y,z);g.rotation.y=ang;
  box(.76,.14,.72,0x17181a,0,.56,0,g);box(.76,1.05,.13,0x17181a,0,1.1,-.34,g);box(.42,.22,.1,0x2b2d30,0,1.48,-.3,g);
  for(const s of[-.4,.4])box(.07,.26,.5,0x101112,s,.74,0,g);
  box(.09,.42,.09,0x444444,0,.28,0,g);box(.66,.05,.66,0x1a1a1a,0,.05,0,g);scene.add(g);

box(.55,.04,.85,0xe2e2de,EX0+.27,TERREO+1.75,16.1,wEscuro);box(.42,.24,.5,0x1a1b1e,EX0+.25,TERREO+1.89,16.1,wEscuro);
const capacete=new THREE.Mesh(new THREE.SphereGeometry(.2,16,12),M(0x8c1f22));capacete.position.set(EX0+.2,TERREO+1.72,17.1);capacete.castShadow=true;wEscuro.add(capacete);

lote(.42,.56,.03,0xe9dfc6,1.05,TERREO+1.72,12.7);

/* gaiola com rodas, lixeira e caixas com fita laranja */

lote(1.3,2.5,1.3,GRADE,GX,TERREO+1.27,GZ);

lote(.45,.2,.35,0x17181a,GX-.2,TERREO+.24,GZ+.2);lote(.4,.2,.3,0x17181a,GX+.3,TERREO+.24,GZ-.2);
const lixeira=new THREE.Mesh(new THREE.CylinderGeometry(.34,.28,.95,18),M(0x17181a));lixeira.position.set(-3.1,TERREO+.48,18.1);lixeira.castShadow=true;scene.add(lixeira);
function pilha(x0,x1,z0,z1,altura){
  for(let x=x0;x<x1-.3;x+=.85)for(let z=z0;z<z1-.3;z+=.85){
    const n=1+Math.floor(sorteio()*altura);
    for(let k=0;k<n;k++){
      const w=.72+sorteio()*.12,h=.5+sorteio()*.2,mat=k%3===2?STYLU:FITA;
      lote(w,h,w,mat,x+.4+(sorteio()-.5)*.08,TERREO+h/2+k*.62,z+.4+(sorteio()-.5)*.08,(sorteio()-.5)*.25);
    }
  }
}
pilha(1.05,2.95,12.8,15.6,4);        /* caixas ao lado da porta e das janelas */

fecharLotes();

/* ---------- Equipe ---------- */
const TEAM=[
 {name:'Rafael',real:'rafael',desk:1,shirt:0x2f7fe0,skin:0xe8b48f,hair:0x2a1d15,role:'Promoções do Mercado Livre',goal:'Às 7:00, 12:00 e 16:00 lista o SKU e o MLB dos anúncios ativos sem promoção.',idle:'Aguardando'},
 {name:'Julio',desk:4,shirt:0xf5c518,skin:0xc98f65,hair:0x17120e},
 {name:'Matheus',desk:2,shirt:0x25282c,skin:0xf0c7a4,hair:0x4a4038},
 {name:'Luisa',real:'luisa',desk:7,shirt:0x8a5fa8,skin:0xe8b48f,hair:0x6b3c1f,role:'Controle de envios',goal:'Conta o que precisa sair hoje e avisa o que ficou para trás.',idle:'Aguardando'},
].map(t=>({role:'Função a definir',goal:'',idle:'Aguardando função',...t}));

const hub=(i,z)=>[-7+i*.12,z];
const bayDesk=(x,ang)=>z=>({seat:[x,z],ang,chain:i=>[hub(i,z)]});
const DESKS=[
 ...bayCenters(BAYS_JANELA).map(bayDesk(-5.1,Math.PI/2)),
 ...bayCenters(BAYS_MURAL).map(bayDesk(-7.9,-Math.PI/2)),
 {seat:[-8,5.9],ang:-Math.PI/2,chain:i=>[[-8,4.6],[-9.4,4.5],[-9.4,3.45],hub(i,3.45)]},
 {seat:[-1.6,14.4],ang:-Math.PI/2,y:TERREO,cadeira:'mesh',chain:()=>[]}, /* 7: bancada da expedição */
 {seat:[-4.1,13.9],ang:-Math.PI/2,y:TERREO,chain:()=>[]}, /* 8: pós-venda */
 {seat:[.35,13.75],ang:Math.PI,frente:.95,y:TERREO,cadeira:'mesh',chain:()=>[]}, /* 9: estoque */
].map(d=>({...d,kind:'desk',seated:true}));
const sofaSpot=z=>({seat:[-9.2,z],ang:Math.PI/2,seated:true,chain:i=>[[-7.8,z],hub(i,z)]});
const coffeeSpot=z=>({seat:[-4.5,z],ang:Math.PI/2,seated:false,chain:i=>[hub(i,z)]});
const REST=[sofaSpot(-4.1),coffeeSpot(-5.4),coffeeSpot(-4.6),{seat:[-.4,16.4],ang:-Math.PI/2,seated:false,y:TERREO,chain:()=>[]}].map(r=>({...r,kind:'rest'}));
const same=(p,q)=>p&&q&&p[0]===q[0]&&p[1]===q[1];
function route(a,from,to){
  const A=from.chain(a.i),B=to.chain(a.i);let shared=null;
  while(A.length&&B.length&&same(A[A.length-1],B[B.length-1])){shared=A.pop();B.pop()}
  return[...A,...(shared?[shared]:[]),...B.reverse(),to.seat];
}

const capsule=(r,l,c)=>{const m=new THREE.Mesh(new THREE.CapsuleGeometry(r,l,4,10),M(c));m.castShadow=true;return m};
const ball=(r,c)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r,18,14),M(c));m.castShadow=true;return m};
function makePerson(a){
  const g=new THREE.Group();
  const limb=(x,y,r,l,c,hand)=>{const p=new THREE.Group();p.position.set(x,y,0);const m=capsule(r,l,c);m.position.y=-l/2-r*.4;p.add(m);
    if(hand){const h=ball(.095,a.skin);h.position.y=-l-.17;p.add(h)}g.add(p);return p};
  a.legL=limb(-.13,.76,.115,.52,0x23262b);a.legR=limb(.13,.76,.115,.52,0x23262b);
  const t=capsule(.28,.4,a.shirt);t.position.y=1.12;g.add(t);
  a.armL=limb(-.36,1.38,.08,.46,a.shirt,true);a.armR=limb(.36,1.38,.08,.46,a.shirt,true);
  const head=ball(.25,a.skin);head.position.y=1.72;g.add(head);
  const hair=new THREE.Mesh(new THREE.SphereGeometry(.265,18,10,0,Math.PI*2,0,1.5),M(a.hair));hair.position.set(0,1.74,-.02);hair.rotation.x=-.3;hair.castShadow=true;g.add(hair);
  scene.add(g);return g;
}
function makeStation(place){
  const[x,z]=place.seat,y=place.y||0,f=place.frente||1.42,g=new THREE.Group();g.position.set(x,y,z);g.rotation.y=place.ang;scene.add(g);
  (place.cadeira==='mesh'?mesh:gaming)(x,z,place.ang,y);
  box(.1,.34,.1,0x333333,0,1.22,f,g);box(.5,.04,.3,0x333333,0,1.06,f,g);
  box(1.16,.72,.06,0x202124,0,1.74,f+.03,g);
  const screen=textPlane(1.06,.62,276,160,(c,w,h)=>drawScreen(c,w,h,place.owner));
  screen.mesh.position.set(0,1.74,f-.005);screen.mesh.rotation.y=Math.PI;g.add(screen.mesh);
  box(.7,.04,.28,0xdddddd,0,1.07,f-.44,g);
  box(.13,.18,.13,0xf7f3ea,-.56,1.14,f-.37,g);
  box(.3,.1,.24,0x2a2a2a,.56,1.1,f-.37,g);
  place.st={screen};
}
function drawScreen(c,w,h,a){
  if(!a){c.fillStyle='#0c0d0f';c.fillRect(0,0,w,h);return} /* baia livre */
  const away=a.place.kind!=='desk'||a.path.length>0;
  c.fillStyle=away?'#2a2e33':'#0f1d2b';c.fillRect(0,0,w,h);c.textBaseline='top';
  if(away){c.fillStyle='#8b949c';c.font='600 20px system-ui';c.textAlign='center';c.fillText('Ausente',w/2,h/2-12);c.textAlign='left';return}
  c.textAlign='left';c.fillStyle='#fff';c.font='600 17px system-ui';c.fillText(a.activity.slice(0,26),12,10);
  if(!a.progresso)return;
  a.codeSeed=(a.codeSeed||0)+1;
  for(let i=0;i<6;i++){
    const n=Math.sin((i+a.codeSeed)*12.9+a.i*7)*43758.5,f=n-Math.floor(n);
    c.fillStyle=['#f5c518','#54a7e8','#9cc4ff','#e8e8e8'][Math.floor(f*4)];
    c.fillRect(12+(i%3)*12,38+i*15,50+f*170,7);
  }
  c.fillStyle='#31424e';c.fillRect(12,h-14,w-24,7);c.fillStyle='#f5c518';c.fillRect(12,h-14,(w-24)*a.progresso/100,7);
}
DESKS.forEach(makeStation);
const agents=TEAM.map((t,i)=>{
  const home=DESKS[t.desk];
  const a={...t,...home.st,i,home,place:home,target:home,x:home.seat[0],z:home.seat[1],ang:home.ang,rot:home.ang,path:[],activity:t.idle,progresso:0,seatT:1,phase:i,sayUntil:0};
  home.owner=a;a.g=makePerson(a);return a;
});
const ringMark=new THREE.Mesh(new THREE.RingGeometry(.55,.72,32),new THREE.MeshBasicMaterial({color:0xf5c518,side:THREE.DoubleSide}));
ringMark.rotation.x=-Math.PI/2;ringMark.visible=false;scene.add(ringMark);

/* ---------- Rótulos e progresso ---------- */
for(const a of agents){
  const wrap=document.createElement('div');wrap.className='tagwrap';
  const bubble=document.createElement('div');bubble.className='bubble';bubble.hidden=true;
  const tag=document.createElement('button');tag.type='button';tag.className='tag';tag.textContent=a.name;tag.onclick=()=>select(a);
  wrap.append(bubble,tag);labels.append(wrap);Object.assign(a,{wrap,bubble,tag});
  const card=document.createElement('button');card.type='button';card.className='card';
  card.innerHTML=`<span class="row"><span class="dot" style="background:#${a.shirt.toString(16).padStart(6,'0')}"></span><b></b><span class="role"></span></span><span class="st"></span><span class="bar"><i></i></span><span class="info"></span>`;
  card.querySelector('b').textContent=a.name;card.querySelector('.role').textContent=a.role;
  card.onclick=()=>select(a);$('#team').append(card);
  Object.assign(a,{card,stEl:card.querySelector('.st'),barEl:card.querySelector('.bar i'),infoEl:card.querySelector('.info')});
}
function say(a,txt,dur=3){a.bubble.textContent=txt;a.bubble.hidden=false;a.sayUntil=sim+dur}

/* ---------- Rotina no escritório ---------- */
let sim=0;const queue=[];
const at=(d,fn)=>queue.push({t:sim+d,fn});
function goTo(a,to,label,after){
  const run=()=>{
    if(a.place===to){after&&after();return}
    a.path=route(a,a.place,to);a.target=to;a.after=after;a.activity=label;a.queued=null;
  };
  if(a.path.length)a.queued=run;else run();
}
function arrive(a){
  a.place=a.target;a.ang=a.place.ang;
  if(a.queued){const q=a.queued;a.queued=null;q()}else a.after&&a.after();
}
function backToDesk(a){goTo(a,a.home,'Voltando para a mesa',()=>{a.activity=a.idle})}
function rest(a){
  if(a.progresso||a.place!==a.home||a.path.length)return;
  const spot=REST[a.i];
  goTo(a,spot,spot.seated?'Indo para o sofá':'Indo tomar café',()=>{a.activity=spot.seated?'No sofá':'Tomando café';at(8+Math.random()*6,()=>{if(a.place===spot)backToDesk(a)})});
}
let nextIdle=6;
function idleTick(){
  if(sim<nextIdle)return;nextIdle=sim+10+Math.random()*12;
  rest(agents[Math.floor(Math.random()*agents.length)]);
}

/* ---------- Animação ---------- */
const lerp=(a,b,t)=>a+(b-a)*t;
function animate(a,dt){
  if(a.path.length){
    const[tx,tz]=a.path[0],dx=tx-a.x,dz=tz-a.z,d=Math.hypot(dx,dz),s=3.2*dt;
    if(d<=s){a.x=tx;a.z=tz;a.path.shift();if(!a.path.length)arrive(a)}
    else{a.x+=dx/d*s;a.z+=dz/d*s;a.ang=Math.atan2(dx,dz)}
  }
  const walking=a.path.length>0,seated=!walking&&a.place.seated;
  const k=Math.min(1,dt*9);
  a.seatT=lerp(a.seatT,seated?1:0,k);
  let dr=a.ang-a.rot;dr=Math.atan2(Math.sin(dr),Math.cos(dr));a.rot+=dr*Math.min(1,dt*11);
  a.g.position.set(a.x,(a.place.y||0)-.2*a.seatT,a.z);a.g.rotation.y=a.rot;
  a.phase+=dt;
  const sw=walking?Math.sin(a.phase*10):0;
  let al=-sw*.55,ar=sw*.55;
  if(!walking&&a.place.kind==='desk'){
    if(a.progresso){al=-1.25+Math.sin(a.phase*23)*.07;ar=-1.25+Math.sin(a.phase*23+2)*.07}
    else{al=-1.05;ar=-1.05}
  }
  else if(!walking&&a.place.kind==='rest'&&!a.place.seated){ar=-1.75;al=0}
  a.armL.rotation.x=lerp(a.armL.rotation.x,al,k);a.armR.rotation.x=lerp(a.armR.rotation.x,ar,k);
  const leg=-1.45*a.seatT;
  a.legL.rotation.x=lerp(a.legL.rotation.x,leg+sw*.6,k);a.legR.rotation.x=lerp(a.legR.rotation.x,leg-sw*.6,k);
}
const v=new THREE.Vector3(),tmpT=new THREE.Vector3();let last=performance.now(),paintT=0,uiT=0;
function frame(now){
  requestAnimationFrame(frame);
  const raw=(now-last)/1000;last=now;const dt=Math.min(raw,.1);
  sim+=dt;
  for(let i=queue.length-1;i>=0;i--)if(queue[i].t<=sim){const f=queue[i].fn;queue.splice(i,1);f()}
  idleTick();
  for(const a of agents)animate(a,dt);
  for(const f of fans)f.blades.rotation.z+=dt*7;
  paintT+=dt;if(paintT>.6){paintT=0;for(const a of agents)a.screen.paint()}
  if(tween){
    const k=Math.min(1,raw*3.5),p=viewPos(tween);
    cam.position.lerp(p,k);controls.target.lerp(tmpT.set(...tween.t),k);cam.zoom=lerp(cam.zoom,tween.zoom,k);cam.updateProjectionMatrix();
    if(cam.position.distanceTo(p)<.05&&Math.abs(cam.zoom-tween.zoom)<.01)tween=null;
  }
  controls.update();
  /* parede entre a câmera e a sala some, para ver o que há dentro */
  const cx=cam.position.x-controls.target.x,cz=cam.position.z-controls.target.z;
  for(const{g,n}of perims)g.visible=n[0]*cx+n[1]*cz>0;
  uiT+=dt;
  const w=stage.clientWidth,h=stage.clientHeight;
  for(const a of agents){
    v.set(a.x,a.g.position.y+2.3,a.z).project(cam);
    a.wrap.style.transform=`translate(${(v.x+1)/2*w}px,${(1-v.y)/2*h}px) translateY(-100%)`;
    if(!a.bubble.hidden&&sim>a.sayUntil)a.bubble.hidden=true;
    if(uiT>.2){a.stEl.textContent=a.activity;a.barEl.style.width=a.progresso+'%'}
  }
  if(uiT>.2)uiT=0;
  if(selected){ringMark.visible=true;ringMark.position.set(selected.x,(selected.place.y||0)+.06,selected.z)}else ringMark.visible=false;
  renderer.render(scene,cam);
}
for(const d of DESKS)d.st.screen.paint();
requestAnimationFrame(frame);

/* ---------- Entregas: o que cada um fez ---------- */
const NOME_TIPO={manha:'Relatório da manhã',noite:'Relatório da noite'};
const hora=d=>new Date(d).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const data=d=>new Date(d).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const mesmoDia=(a,b)=>new Date(a).toDateString()===new Date(b).toDateString();
let selected=agents.find(a=>a.real==='luisa'),idsNaLista=null;

function select(a){
  selected=a;
  for(const b of agents){b.card.classList.toggle('sel',b===a);b.tag.classList.toggle('sel',b===a)}
  $('#e-titulo').textContent=`Entregas: ${a.name}`;
  $('#e-objetivo').textContent=a.goal;
  $('#gerar').hidden=!a.real;
  $('#e-corpo').hidden=!a.real;
  $('#e-vazio').hidden=!!a.real;
  $('#e-vazio').textContent=`${a.name} ainda não tem função definida, então não há entregas.`;
  $('#p-luisa').hidden=$('#e-tokens').hidden=a.real!=='luisa';
  $('#p-rafael').hidden=a.real!=='rafael';
  if(a.dados)pintarEntregas(a);
}

function montarLista(relatorios){
  const ids=relatorios.map(r=>r.id).join();
  if(ids===idsNaLista)return; /* não fecha o que a pessoa abriu quando só o progresso muda */
  idsNaLista=ids;
  const lista=$('#e-lista');lista.replaceChildren();
  if(!relatorios.length){const p=document.createElement('p');p.textContent='Nenhum relatório ainda.';lista.append(p);return}
  relatorios.forEach((r,i)=>{
    const d=document.createElement('details');d.open=i===0;
    const s=document.createElement('summary');
    s.textContent=r.manual?'Relatório gerado na hora':NOME_TIPO[r.tipo]??`Relatório das ${r.tipo}`;
    const q=document.createElement('span');q.textContent=`${data(r.geradoEm)}${r.tokens?` · ${r.tokens.toLocaleString('pt-BR')} tokens`:''}`;s.append(q);
    d.append(s);
    if(r.resumo){const p=document.createElement('p');p.textContent=r.resumo;d.append(p)}
    const t=document.createElement('pre');t.textContent=r.texto;d.append(t);
    lista.append(d);
  });
}

function pintarEntregas(a){
  const{estado,relatorios}=a.dados;
  if(a.real==='rafael'){
    $('#ra-sem').textContent=estado.painel?.semPromocao??'-';
    $('#ra-ativos').textContent=estado.painel?.ativos??'-';
  }else{
    if(estado.painel){
      for(const[prefixo,c]of[['ml',estado.painel.mercado_livre],['sh',estado.painel.shopee]]){
        $(`#${prefixo}-a`).textContent=c.atrasados;$(`#${prefixo}-h`).textContent=c.hoje;$(`#${prefixo}-p`).textContent=c.proximos;
      }
    }
    const agora=Date.now();
    const tokens=relatorios.filter(r=>mesmoDia(r.geradoEm,agora)).reduce((t,r)=>t+(r.tokens||0),0);
    $('#e-tokens').textContent=`Tokens gastos hoje: ${tokens.toLocaleString('pt-BR')}`;
  }
  $('#e-atualizado').textContent=estado.atualizadoEm?`Painel atualizado às ${hora(estado.atualizadoEm)}`:'Aguardando a primeira leitura.';
  $('#e-erro').hidden=!estado.erro;$('#e-erro').textContent=estado.erro?`Atenção: ${estado.erro}`:'';
  montarLista(relatorios);
}

function mostrar(a,dados){
  const{estado,relatorios}=dados;
  a.dados=dados;
  a.idle=estado.atividade;a.progresso=estado.progresso>0&&estado.progresso<100?estado.progresso:0;
  if(a.progresso&&a.place!==a.home)goTo(a,a.home,estado.atividade,()=>{a.activity=a.idle});
  else if(a.place===a.home&&!a.path.length)a.activity=estado.atividade;
  const r=relatorios[0];
  a.infoEl.textContent=`${r?`Última entrega: ${data(r.geradoEm)} · `:''}Próxima: ${estado.proximo}`;
  if(selected===a)pintarEntregas(a);
  if(r&&a.ultimoRelatorio&&r.id!==a.ultimoRelatorio)say(a,'Relatório pronto!',4);
  if(r)a.ultimoRelatorio=r.id;
}
select(selected);
const fonte=new EventSource('api/eventos');
for(const a of agents.filter(a=>a.real)){
  fetch(`api/${a.real}`).then(r=>r.ok?r.json():null).then(d=>d&&mostrar(a,d)).catch(()=>{});
  fonte.addEventListener(a.real,e=>mostrar(a,JSON.parse(e.data)));
}
$('#gerar').onclick=()=>fetch(`api/${selected.real}/gerar`,{method:'POST',headers:{'x-escritorio':'1'}}).catch(()=>{});
</script>
